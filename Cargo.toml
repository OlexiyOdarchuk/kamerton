[package]
name = "kamerton"
version = "0.1.4"
edition = "2024"

[dependencies]
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.2"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

# Розпаковка ffmpeg (.7z) потрібна лише на Windows.
[target.'cfg(windows)'.dependencies]
sevenz-rust2 = { version = "0.25.0", default-features = false }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Залежності (декодування картинок, zip) у debug-збірці теж оптимізовані, інакше обкладинки вантажаться секундами.
[profile.dev.package."*"]
opt-level = 2
