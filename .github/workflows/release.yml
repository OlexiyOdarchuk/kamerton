# Реліз: підняти version у Cargo.toml, закомітити, потім
#   git tag -a v0.2.0 -m "Що змінилось" && git push origin v0.2.0
# Повідомлення тегу стане описом релізу. CI збере програму під Windows, Linux і macOS
# і прикладе файли до релізу. Встановлені копії підхоплять оновлення при наступному запуску.
#
# Щоб доскласти файл до вже існуючого релізу: Actions → Release → Run workflow → тег і платформа.
#   gh workflow run release.yml -f tag=v0.1.0 -f platform=macos
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег існуючого релізу, наприклад v0.1.0"
        required: true
      platform:
        description: "Що зібрати"
        type: choice
        options: [all, windows, linux, macos]
        default: all

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Які платформи збирати
        id: matrix
        run: |
          all='[
            {"name": "windows", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "bin": "kamerton.exe", "asset": "kamerton-windows-x86_64.exe"},
            {"name": "linux", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "bin": "kamerton", "asset": "kamerton-linux-x86_64"},
            {"name": "macos", "os": "macos-latest", "target": "aarch64-apple-darwin", "bin": "kamerton", "asset": "kamerton-macos-aarch64"}
          ]'
          echo "matrix=$(echo "$all" | jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .name == $p))')" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ github.event.inputs.platform || 'all' }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Перевірити, що тег збігається з версією
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$TAG" ]; then
            echo "Версія в Cargo.toml ($v) не збігається з тегом $TAG" >&2
            exit 1
          fi
      - name: Створити реліз з описом
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Реліз $TAG уже існує, лише доскладаємо файли"
            exit 0
          fi
          # Опис: повідомлення тегу (або коміту, якщо тег без повідомлення) + як встановити.
          git tag -l --format='%(contents)' "$TAG" > notes.md
          if [ ! -s notes.md ]; then git log -1 --format='%B' "$TAG" > notes.md; fi
          cat .github/release-install.md >> notes.md
          gh release create "$TAG" --title "Камертон $TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.create.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Бібліотеки для Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - name: Збірка
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Додати до релізу
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
